<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="lol">Artworks</title>
  <script>
    var texts = [
      "Artworks",
      "Artworks, ze~",
    ];
    document.getElementById('lol').innerHTML = texts[Math.floor(Math.random() * texts.length)];
  </script>
  <link href="../style.css" rel="stylesheet" type="text/css" media="all">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
  <script src="../theme.js"></script>
  <script src="../lang.js" defer></script>
</head>

<body>
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">✕</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <div class="header">
    <h1 id="logo"><a href="index.html" data-i18n="site_title">Touhou Club of the University of Minnesota</a></h1>
    <ul class="nav-links">
      <li><a href="../index.html" data-i18n="nav_about">About</a></li>
      <li><a href="faa.html" data-i18n="nav_art">Art</a></li>
      <li><a href="fafic.html" data-i18n="nav_fiction">Fiction</a></li>
      <li><a href="events.html" data-i18n="nav_events">Events</a></li>
      <li><a href="credits.html" data-i18n="nav_credits">Credits</a></li>
      <li><a href="join.html" data-i18n="nav_join" class="join-btn">Join Us</a></li>

      <li class="lang-menu">
        <button id="lang-btn" aria-label="Select language" data-i18n-attr="aria-label:lang_select" aria-haspopup="true"
          aria-expanded="false">
          <i class="fa-solid fa-earth-americas"></i>
        </button>
        <ul id="lang-list" class="lang-list">
          <li><button data-lang="en">English</button></li>
          <li><button data-lang="es">Español</button></li>
          <li><button data-lang="cn">中文</button></li>
          <li><button data-lang="ru">Pусский</button></li>
        </ul>
      </li>
    </ul>
  </div>

  <div class="page-layout">
    <main class="main gallery-main">
      <h2 class="hero-title">Artwork</h2>

      <div class="gallery-grid">

        <div class="gallery-item">
          <img src="../imgs/kennybop_sakuyahelp.png" alt="sakuyahelp by kennybop" onclick="openLightbox(this.src)">
          <span class="art-author">© kennybop</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_aya.png" alt="aya by WRain" onclick="openLightbox(this.src)">
          <span class="art-author">© WRain</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_sanae.jpg" alt="sanae by WRain" onclick="openLightbox(this.src)">
          <span class="art-author">© WRain</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_momoyo.png" alt="momoyo by WRain" onclick="openLightbox(this.src)">
          <span class="art-author">© WRain</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/Ink_reimu.png" alt="Reimu by Ink" onclick="openLightbox(this.src)">
          <span class="art-author">© Ink</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/Ether_reimu_loading.gif" alt="Reimu by Ether" onclick="openLightbox(this.src)">
          <span class="art-author">© Ether</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_toyohime_yorihime.png" alt="Toyohime and Yorihime by WRain"
            onclick="openLightbox(this.src)">
          <span class="art-author">© WRain</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_moon.png" alt="Moon by WRain" onclick="openLightbox(this.src)"
            style="object-position: 10% !important;">
          <span class="art-author">© WRain</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_tenshi.png" alt="Tenshin Day by WRain" onclick="openLightbox(this.src)"
            style="object-position: 50% 10% !important;">
          <span class="art-author">© WRain</span>
        </div>

        <div class="gallery-item">
          <img src="../imgs/WRain_kkr.png" alt="Kokoro by WRain" onclick="openLightbox(this.src)"
            style="object-position: 50% 10% !important;">
          <span class="art-author">© WRain</span>
        </div>

      </div>
    </main>
  </div>

  <footer class="footer">
    <a href="https://discord.gg/XPkmejzgx" class="footer-icon" title="Discord"><i class="fa-brands fa-discord"></i></a>
    <a href="https://www.instagram.com/2humnclub" class="footer-icon" title="Instagram"><i
        class="fa-brands fa-instagram"></i></a>
    <a href="https://open.spotify.com/playlist/16VnuvSYcm5MkBt9EatOq9?si=581fd68eb5e04eec" class="footer-icon"
      title="Spotify"><i class="fa-brands fa-spotify"></i></a>
    <a href="mailto:2humn@tutanota.de" class="footer-icon" title="Email"><i class="fa-solid fa-envelope"></i></a>
  </footer>

</body>

</html>
